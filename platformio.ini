; Hydroponics Monitoring System - new firmware (ESP32-S3-WROOM-1 N16R8)
; Env names kept from the WROOM-32D era so existing commands still work.
; Architecture: "Firmware Architecture.pdf" (Rev 1). Team guide: README.md.
; Language: all project sources are C (gnu11 on the host). The Arduino-ESP32
; framework stays the platform; its C HAL (esp32-hal-*) and FreeRTOS are used.
;
;   pio run -e esp32dev            production image (src/main.c)
;   pio run -e test_bme280 -t upload -t monitor
;                                  one sensor driver + its bring-up main
;   pio test -e native             host unit tests for src/domain (needs gcc)
;
; Versions are pinned to the ESP-Demo baseline (§13). Do not bump them
; without a compile + API check and a note in README.md.

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------- shared ----
[esp32_base]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
; N16R8: 16 MB QIO flash + 8 MB octal PSRAM (GPIO33-37 reserved).
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; Both pins are C++ libraries, kept for WP8 and not used by project code.
; From C, WP8 uses NimBLE's host C API (bundled in NimBLE-Arduino) and cJSON/snprintf.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -I src
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
test_ignore =
    bringup
    native

; ------------------------------------------------------------ production ----
[env:esp32dev]
extends = esp32_base
build_src_filter = +<*>

; ------------------------------------------------------ sensor bring-up ----
; Each env links every production module (drivers, hal, domain, ...) but
; replaces src/main.c with a single test/bringup/<sensor>_main.c (R9).
[bringup_base]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -I test/bringup
    -D FW_BRINGUP=1

[env:test_bme280]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/bme280_main.c>

[env:test_ds18b20]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/ds18b20_main.c>

[env:test_light]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/light_main.c>

[env:test_hcsr04]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/hcsr04_main.c>

[env:test_ph]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/ph_main.c>

[env:test_tds]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/tds_main.c>

[env:test_mq7]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/mq7_main.c>

; ------------------------------------------------------- host unit tests ----
; Only src/domain is compiled: it must stay free of Arduino/FreeRTOS headers.
[env:native]
platform = native
build_flags =
    -I src
    -I include
    -std=gnu11
build_src_filter = -<*> +<domain/>
test_build_src = yes
test_filter = native/*
test_ignore = bringup
