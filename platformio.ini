; Hydroponics Monitoring System - new firmware (ESP32-S3-WROOM-1 N16R8)
; Env names kept from the WROOM-32D era so existing commands still work.
; Architecture: "Firmware Architecture.pdf" (Rev 3). Team guide: README.md.
; Language: all project sources are C (gnu11 on the host). The Arduino-ESP32
; framework stays the platform; its C HAL (esp32-hal-*) and FreeRTOS are used.
;
;   pio run -e esp32dev            production image (src/main.c)
;   pio run -e test_bme280 -t upload -t monitor
;                                  one sensor driver + its bring-up main
;   pio test -e native             host unit tests for src/domain (needs gcc)
;
; Versions are pinned to the ESP-Demo baseline (§13). Do not bump them
; without a compile + API check and a note in README.md.

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------- shared ----
[esp32_base]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
; N16R8: 16 MB QIO flash + 8 MB octal PSRAM (GPIO35-37 reserved, as board_profile.h).
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; NimBLE-Arduino (C++) is used through the C shim src/transports/ble_gatt.cpp.
; ArduinoJson is not used by project code (JSON is built in domain/protocol_codec).
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -I src
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
test_ignore =
    bringup
    native

; ------------------------------------------------------------ production ----
; Production images run the BLE transport (NimBLE) and the Wi-Fi station.
; Bring-up envs define neither, so they never link the radios.
[production]
build_flags =
    ${esp32_base.build_flags}
    -D FW_ENABLE_BLE=1
    -D FW_ENABLE_WIFI=1

[env:esp32dev]
extends = esp32_base
build_flags = ${production.build_flags}
build_src_filter = +<*>

; Acceptance test (§19 "Stall injection"): production image whose task blocks
; forever after 60 s. Expect: Supervisor WARN at ~2 s (acq) / ~1 s (safety),
; lamp OFF within 3 s (acq only), task-watchdog reset at ~5 s, then
; "reset reason: TASK_WDT" on the next boot. Never deploy these.
[env:stall_acq]
extends = env:esp32dev
build_flags =
    ${production.build_flags}
    -D FW_INJECT_STALL_ACQ=60000

[env:stall_safety]
extends = env:esp32dev
build_flags =
    ${production.build_flags}
    -D FW_INJECT_STALL_SAFETY=60000

; Acceptance test (§19 "Temperature alarm"): a test rule trips on every valid
; BME280 sample (4 per second, every frame phase) and de-energises the relay.
; Safety logs submit->action (us) and sample->action (ms) every 20 TRIPs.
; Target: sample -> Safety action <= 10 ms. Never deploy.
[env:alarm_latency]
extends = env:esp32dev
build_flags =
    ${production.build_flags}
    -D FW_ALARM_LATENCY_TEST=1

; ------------------------------------------------------ sensor bring-up ----
; Each env links every production module (drivers, hal, domain, ...) but
; replaces src/main.c with a single test/bringup/<sensor>_main.c (R9).
[bringup_base]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -I test/bringup
    -D FW_BRINGUP=1

[env:test_bme280]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/bme280_main.c>

[env:test_ds18b20]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/ds18b20_main.c>

[env:test_light]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/light_main.c>

; Light level -> relay module (GPIO15) -> grow lamp, hysteresis + dwell.
[env:test_lamp]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/lamp_main.c>

[env:test_hcsr04]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/hcsr04_main.c>

[env:test_ph]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/ph_main.c>

[env:test_tds]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/tds_main.c>

[env:test_sgp30]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/sgp30_main.c>

; Shared I2C bus: BME280 + SGP30 together, BME280 humidity -> SGP30 compensation.
[env:test_climate]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/climate_main.c>

; Water probes: DS18B20 + TDS together, DS18B20 water temperature -> TDS compensation.
[env:test_water]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/water_main.c>

; External-power sense on GPIO8: edges (ISR, us) + ADC trace (1 kHz) on plug/unplug.
; Commissioning gate for BOARD_POWER_SENSE_VERIFIED. DTR/RTS released so that
; reopening the monitor after an unplug does not reset the board.
[env:test_power_sense]
extends = bringup_base
build_src_filter = +<*> -<main.c> +<../test/bringup/power_sense_main.c>
monitor_dtr = 0
monitor_rts = 0

; ------------------------------------------------------- host unit tests ----
; Only src/domain is compiled: it must stay free of Arduino/FreeRTOS headers.
[env:native]
platform = native
build_flags =
    -I src
    -I include
    -std=gnu11
build_src_filter = -<*> +<domain/>
test_build_src = yes
test_filter = native/*
test_ignore = bringup
